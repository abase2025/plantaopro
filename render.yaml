databases:
  - name: plantaopro-db
    databaseName: plantaopro
    user: plantaopro
    plan: free
    ipAllowList: []
    postgresMajorVersion: "16"

services:
  - type: web
    name: plantaopro-api
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install
    startCommand: npm run migrate && node db-pg.js seed && npm start
    rootDir: .
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: plantaopro-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CRON_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: https://abase2025.github.io,http://localhost:3000,http://localhost:5500
      - key: APP_BASE_URL
        value: https://abase2025.github.io/plantoopro
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      # Lembretes por e-mail (escolha UMA das opções; se vazio cai no stub)
      - key: SMTP_FROM
        value: PlantãoPro <alertas@plantaopro.com>
      # Lembretes por push (VAPID) — cole no Render > Environment (Generate Value)
      # Para simplificar, no Render você pode usar as chaves geradas:
      # VAPID_PUBLIC  = (cole abaixo ao provisionar)
      # VAPID_PRIVATE = (cole abaixo ao provisionar)
      - key: VAPID_SUBJECT
        value: "mailto:admin@plantaopro.com"
