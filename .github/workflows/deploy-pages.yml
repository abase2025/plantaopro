name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Garante concorrência (cancela build anterior se ainda em vôo)
concurrency:
  group: "pages"
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Materializar build estática em docs/
        run: |
          rm -rf docs
          mkdir -p docs
          cp -r public/* docs/
          touch docs/.nojekyll
          ls -la docs/

      - name: Configure Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
